{{/* Custom skills: grouped chips */}}
{{ $c := .wcBlock.content }}
<div class="col-12">
  <div class="ae-section-head">
    {{ with $c.kicker }}<span class="ae-kicker">{{ . }}</span>{{ end }}
    <h2 class="ae-h2">{{ $c.heading }}</h2>
  </div>
  <div class="ae-skills">
    {{ range $c.groups }}
    <div class="ae-skill-group">
      <div class="ae-skill-name"><i class="{{ .icon }}" aria-hidden="true"></i> {{ .name }}</div>
      <div class="ae-skill-chips">
        {{ range .items }}<span class="ae-tag">{{ . }}</span>{{ end }}
      </div>
    </div>
    {{ end }}
  </div>
</div>
